services:
  - type: web
    name: sllas-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: "https://isllas-clone.onrender.com"
      - key: API_INTERNAL_URL
        value: "http://localhost:3001"

