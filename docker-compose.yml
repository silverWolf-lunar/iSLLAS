# ─────────────────────────────────────────────────────────────
# SLLAS — Docker Compose (Development)
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d            # Start all services
#   docker compose down             # Stop all services
#   docker compose logs -f postgres # Tail specific service logs
# ─────────────────────────────────────────────────────────────

name: sllas

services:
  # ─── PostgreSQL + PostGIS ───
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sllas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sllas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sllas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sllas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sllas} -d ${POSTGRES_DB:-sllas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: sllas-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── RabbitMQ ───
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sllas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sllas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sllas_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (S3-compatible) ───
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sllas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─── MinIO bucket init ───
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: sllas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set sllas http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin_dev_password};
        mc mb --ignore-existing sllas/sllas-documents;
        mc mb --ignore-existing sllas/sllas-exports;
        mc anonymous set none sllas/sllas-documents;
        mc anonymous set none sllas/sllas-exports;
        echo 'Buckets created successfully';
      "

  # ─── Keycloak ───
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: sllas-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sllas}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-sllas}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-sllas_dev_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "8082:8080"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── Mailpit (Dev email) ───
  mailpit:
    image: axllent/mailpit:latest
    container_name: sllas-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped

  # ─── OpenTelemetry Collector + Jaeger (Dev observability) ───
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: sllas-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
